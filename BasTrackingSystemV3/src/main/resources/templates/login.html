<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPM Bus Network Authentication</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 340px;
        }
        h2 {
            text-align: center;
            color: #800000;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #800000;
            outline: none;
        }
        /* Style untuk Radio Button Container */
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }
        .radio-label {
            display: flex;
            align-items: center;
            font-weight: normal;
            cursor: pointer;
            font-size: 15px;
            color: #444;
        }
        .radio-label input[type="radio"] {
            margin-right: 8px;
            accent-color: #800000; /* Tukar warna bulat radio ikut tema UPM */
            width: 18px;
            height: 18px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #800000;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background: #a00000;
        }
        .error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h2>UPM Bus Tracking V3</h2>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>ID / Matric No:</label>
            <input type="text" name="id" placeholder="Enter your ID" required />
        </div>

        <div class="form-group">
            <label>Password:</label>
            <input type="password" name="password" placeholder="Enter your password" required />
        </div>

        <div class="form-group">
            <label>Select Role:</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="role" value="STUDENT" checked />
                    Student
                </label>
                <label class="radio-label">
                    <input type="radio" name="role" value="DRIVER" />
                    Driver
                </label>
            </div>
        </div>

        <button type="submit">LOGIN</button>
    </form>
</div>
</body>
</html>
